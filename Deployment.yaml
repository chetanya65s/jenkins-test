apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: flask-deployment

  template:
    metadata:
      labels:
        app: flask-deployment

    spec:
      containers:
        - name: flask-container
          image: chetanyagarg/flask_server:latest
          ports:
            - containerPort: 5000
